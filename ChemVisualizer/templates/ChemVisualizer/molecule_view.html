{% extends "template.html" %}
{% load static %}
{% load custom_filters %}

{% block title %}{{ title }}{% endblock %}
{% block head %}
<link rel="stylesheet" href="{% static 'css/desktop/view_molecule.css' %}">
<link rel="stylesheet" href="{% static 'css/mobile/view_molecule.css' %}">

<script src="https://3Dmol.csb.pitt.edu/build/3Dmol-min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>

<meta name="description" content="Перегляд молекули в 3D — {{ title }}">
{% endblock %}

                    </g>
                </svg>
            </button>

                <svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'>
                    <g id="download_2_fill" fill='none'>

                    viewBox='0 0 24 24' id="animationCheckboxSvg">
                    <g id="check_fill" fill='none' fill-rule='evenodd'>
                        <path
                            d='M24 0v24H0V0zM12.593 23.258l-.011.002-.071.035-.02.004-.014-.004-.071-.035c-.01-.004-.019-.001-.024.005l-.004.01-.017.428.005.02.01.013.104.074.015.004.012-.004.104-.074.012-.016.004-.017-.017-.427c-.002-.01-.009-.017-.017-.018m.265-.113-.013.002-.185.093-.01.01-.003.011.018.43.005.012.008.007.201.093c.012.004.023 0 .029-.008l.004-.014-.034-.614c-.003-.012-.01-.02-.02-.022m-.715.002a.023.023 0 0 0-.027.006l-.006.014-.034.614c0 .012.007.02.017.024l.015-.002.201-.093.01-.008.004-.011.017-.43-.003-.012-.01-.01z' />

                    </g>
                </svg>
            </section>
            <span id="animationStatus">Увімкнути анімацію</span>
        </section>

        <section class="show-text">
            <section id="showTextCheckbox">
                <svg style="display: none;" xmlns='http://www.w3.org/2000/svg' width='24' height='24'
                    viewBox='0 0 24 24' id="showTextSvg">
                    <g id="check_fill" fill='none' fill-rule='evenodd'>
                        <path
                            d='M24 0v24H0V0zM12.593 23.258l-.011.002-.071.035-.02.004-.014-.004-.071-.035c-.01-.004-.019-.001-.024.005l-.004.01-.017.428.005.02.01.013.104.074.015.004.012-.004.104-.074.012-.016.004-.017-.017-.427c-.002-.01-.009-.017-.017-.018m.265-.113-.013.002-.185.093-.01.01-.003.011.018.43.005.012.008.007.201.093c.012.004.023 0 .029-.008l.004-.014-.034-.614c-.003-.012-.01-.02-.02-.022m-.715.002a.023.023 0 0 0-.027.006l-.006.014-.034.614c0 .012.007.02.017.024l.015-.002.201-.093.01-.008.004-.011.017-.43-.003-.012-.01-.01z' />
                        <path fill='currentColor'
                            d='M21.546 5.111a1.5 1.5 0 0 1 0 2.121L10.303 18.475a1.6 1.6 0 0 1-2.263 0L2.454 12.89a1.5 1.5 0 1 1 2.121-2.121l4.596 4.596L19.424 5.111a1.5 1.5 0 0 1 2.122 0' />
                    </g>
                </svg>
            </section>

        </section>
    </section>
</section>
